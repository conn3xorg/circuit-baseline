name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
        run: ./up.sh
      # Rocky 10's systemd 257 can't take readiness notifications from a
      # service that runs as another user when it runs on the runner's newer
      # kernel, so chronyd fails to start in the container. Real Rocky 10
      # hosts run their own kernel and aren't affected. Starting chronyd as a
      # simple service keeps the test about the circuit.
      - name: Work around Rocky 10 notifications in a container
        if: matrix.distro == 'rocky10'
        run: |
          podman exec circuit-baseline sh -c 'mkdir -p /etc/systemd/system/chronyd.service.d &&
            printf "[Service]\nType=simple\n" > /etc/systemd/system/chronyd.service.d/container.conf'
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Show the host's journal
        if: failure()
        run: |
          podman exec circuit-baseline systemctl --failed --no-pager || true
          podman exec circuit-baseline journalctl -b --no-pager -n 200 || true
      # sshd lists the methods it will take when it refuses a login, so what
      # the settings changed shows from outside the host.
      - name: Check sshd, the clock and the time zone do what the circuit set
        working-directory: examples/local
        run: |
          login() { ssh -i id_ed25519 -p 2222 -o UserKnownHostsFile=known_hosts -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 "$@"; }
          check_sshd() {
            login root@127.0.0.1 true
            refused=$(login -o PubkeyAuthentication=no -o PreferredAuthentications=password root@127.0.0.1 true 2>&1 || true)
            echo "$refused" | grep -q 'Permission denied'
            if echo "$refused" | grep -q 'password'; then echo "sshd still offers passwords: $refused" >&2; exit 1; fi
          }
          check_sshd
          [ "$(login root@127.0.0.1 'date +%Z')" = "$(TZ=Europe/Dublin date +%Z)" ]
          podman exec circuit-baseline chronyc -n waitsync 30 0 0 5
          [ "$(podman exec circuit-baseline sysctl -n net.ipv4.tcp_syncookies)" = 1 ]
          podman exec circuit-baseline sh -c 'systemctl restart sshd 2>/dev/null || systemctl restart ssh'
          check_sshd
      # MaxAuthTries takes a number, so sshd rejects "lots".
      - name: Check a value sshd rejects fails the apply, never reaches the drop-in, and sshd survives a restart
        working-directory: examples/local
        run: |
          printf 'module "baseline" {\n  sshd_settings = { MaxAuthTries = "lots" }\n}\n' > bad_override.tf
          conn3x apply -auto-approve && exit 1
          rm bad_override.tf
          podman exec circuit-baseline grep -q lots /etc/ssh/sshd_config.d/00-conn3x-baseline.conf && exit 1
          podman exec circuit-baseline sh -c 'systemctl restart sshd 2>/dev/null || systemctl restart ssh'
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      - name: Clean up
        if: always()
        working-directory: examples/local
        run: ./down.sh
